[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysbilstm"
version = "1.0.0"
description = "Bidirectional LSTM framework for automatic dysarthric speech detection from MFCC sequences"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "tensorflow>=2.16,<2.21",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
]
keywords = ["dysarthria", "speech", "BiLSTM", "MFCC", "TORGO", "deep-learning"]

[project.scripts]
dysbilstm-train = "dysbilstm.train:main"
dysbilstm-predict = "dysbilstm.predict:main"

[tool.setuptools.packages.find]
include = ["dysbilstm*"]
